name: Deploy Dev

on:
  push:
    branches:
      - Dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Infomaniak
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          password: ${{ secrets.DEV_PASSWORD }}
          script: |
            set -e
            cd ~/sites/dev.opengov.tools
            git fetch origin Dev
            git reset --hard origin/Dev
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php scripts/run-migrations.php
            php -r '$path = ".env"; $content = file_get_contents($path); if ($content === false) { throw new RuntimeException("Cannot read server configuration."); } $line = "MCP_PUBLIC_URL=https://dev.opengov.tools/mcp/"; $updated = preg_replace("/^[ \\t]*(?:export[ \\t]+)?MCP_PUBLIC_URL[ \\t]*=[^\\r\\n]*\\r?$/m", $line, $content, -1, $count); if ($count === 0) { $updated = $content . (str_ends_with($content, "\n") ? "" : "\n") . $line . "\n"; } if ($updated !== $content && file_put_contents($path, $updated, LOCK_EX) !== strlen($updated)) { throw new RuntimeException("Cannot update MCP server configuration."); }'
            php tests/mcp_deployed_discovery_test.php
