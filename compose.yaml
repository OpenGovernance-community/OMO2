name: openmyorganization

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./docker/app/.env.private
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/app/.env:/var/www/html/.env

  etherpad:
    build:
      context: ./docker/etherpad
      dockerfile: Dockerfile
    image: omo-etherpad:local
    env_file:
      - ./docker/etherpad/.env.private
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        plugin_state=/opt/etherpad-lite/var/installed_plugins.json;
        plugin_package=/opt/etherpad-lite/var/plugin_packages/ep_omo_theme/ep.json;
        if ! grep -q '"name":"ep_omo_theme"' "$$plugin_state" 2>/dev/null || ! test -f "$$plugin_package"; then rm -f "$$plugin_state"; fi;
        exec pnpm run prod
    environment:
      NODE_ENV: production
      TITLE: OMO Etherpad local
      PUBLIC_URL: https://doc.localtest.me
      AUTHENTICATION_METHOD: apikey
      EDIT_ONLY: "true"
      REQUIRE_SESSION: "false"
      REQUIRE_AUTHENTICATION: "false"
      TRUST_PROXY: "true"
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_CHARSET: utf8mb4
      COOKIE_SAME_SITE: None
      PRIVACY_UPDATE_CHECK: "false"
    volumes:
      - etherpad_data:/opt/etherpad-lite/var
      - ./docker/etherpad/APIKEY.txt:/opt/etherpad-lite/APIKEY.txt:ro

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: omodev
      MARIADB_USER: omodev
      MARIADB_PASSWORD: omodev
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/conf.d:/etc/mysql/conf.d:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  db_data:
  etherpad_data:
