name: openmyorganization

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./docker/app/.env.private
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/app/.env:/var/www/html/.env
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro

  etherpad:
    build:
      context: ./docker/etherpad
      dockerfile: Dockerfile
    image: omo-etherpad:local
    env_file:
      - ./docker/etherpad/.env.private
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        plugin_state=/opt/etherpad-lite/var/installed_plugins.json;
        plugin_package=/opt/etherpad-lite/var/plugin_packages/ep_omo_theme/ep.json;
        if ! grep -q '"name":"ep_omo_theme"' "$$plugin_state" 2>/dev/null || ! test -f "$$plugin_package"; then rm -f "$$plugin_state"; fi;
        exec pnpm run prod
    environment:
      NODE_ENV: production
      TITLE: OMO Etherpad local
      PUBLIC_URL: https://doc.localtest.me
      AUTHENTICATION_METHOD: apikey
      EDIT_ONLY: "true"
      REQUIRE_SESSION: "false"
      REQUIRE_AUTHENTICATION: "false"
      TRUST_PROXY: "true"
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_CHARSET: utf8mb4
      COOKIE_SAME_SITE: None
      PRIVACY_UPDATE_CHECK: "false"
    volumes:
      - etherpad_data:/opt/etherpad-lite/var
      - ./docker/etherpad/APIKEY.txt:/opt/etherpad-lite/APIKEY.txt:ro

  ethercalc:
    build:
      context: ./docker/ethercalc
      dockerfile: Dockerfile
    image: omo-ethercalc:local
    env_file:
      - ./docker/ethercalc/.env.private
    environment:
      ETHERCALC_PORT: "8000"
      ETHERCALC_HOST: 0.0.0.0
      ETHERCALC_AUTH: "0"
      ETHERCALC_DISABLE_ROOM_INDEX: "1"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ethercalc_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/_health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  collabora:
    build:
      context: ./docker/collabora
      dockerfile: Dockerfile
    image: omo-collabora:local
    env_file:
      - ./docker/collabora/.env.private
    command:
      - --o:ssl.enable=false
      - --o:ssl.termination=true
      - --o:welcome.enable=false
      - --o:home_mode.enable=true
      - --o:net.content_security_policy=frame-ancestors localtest.me:* *.localtest.me:*
    expose:
      - "9980"
    privileged: true

  spacedeck:
    build:
      context: ./docker/spacedeck
      dockerfile: Dockerfile
    image: omo-spacedeck:local
    env_file:
      - ./docker/spacedeck/.env.private
    environment:
      NODE_ENV: development
    expose:
      - "9666"
    volumes:
      - spacedeck_storage:/app/storage
      - spacedeck_database:/app/database
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:9666/', function (response) { process.exit(response.statusCode < 500 ? 0 : 1); }).on('error', function () { process.exit(1); });\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: omodev
      MARIADB_USER: omodev
      MARIADB_PASSWORD: omodev
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/conf.d:/etc/mysql/conf.d:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  db_data:
  etherpad_data:
  ethercalc_data:
  spacedeck_storage:
  spacedeck_database:
