<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission editor regression test</title>
<link rel="stylesheet" href="/common/assets/components.css">
<link rel="stylesheet" href="/omo/api/holons/editor.css">
<link rel="stylesheet" href="/common/permissions/editor.css">
<style>
    :root { --color-primary: #319fa6; --color-surface: #ffffff; --color-surface-alt: #f5f6f8; --color-border: #e1e4e9; --color-text: #202a37; --color-text-light: #687382; --radius-sm: 10px; --radius-md: 16px; }
    * { box-sizing: border-box; }
    body { margin: 16px; font-family: system-ui, sans-serif; }
</style>
<main class="generic-section">
    <h1 class="generic-card-title">Permission editor regression test</h1>
    <p id="result" role="status">Running...</p>
    <div id="permissions">
        <section data-permission-group="projects">
            <h2>Projets</h2>
            <div>
                <div data-permission-key="CAN_CREATE_PROJECT">
                    <div><strong>Creer des projets</strong><code>CAN_CREATE_PROJECT</code><p>Description</p></div>
                    <div><div data-permission-tokens><div class="omo-holon-create__permission-token" data-permission-token="organization" data-permission-scope><span>Enfants du cercle englobant</span><span class="omo-permission-editor__profiles"><label title="Membres"><input type="checkbox" data-permission-profile="member" aria-label="Membres" checked></label><label title="Admin"><input type="checkbox" data-permission-profile="admin" aria-label="Admin" checked></label><label title="Collectif"><input type="checkbox" data-permission-profile="collective" aria-label="Collectif"></label></span><button class="omo-holon-create__permission-token-remove" type="button" aria-label="Retirer cette portée">&times;</button></div></div><select data-permission-select><option>Ajouter une portee</option></select></div>
                </div>
                <div data-permission-key="CAN_DELETE_PROJECT">
                    <div><strong>Supprimer des projets</strong><code>CAN_DELETE_PROJECT</code><p>Description</p></div>
                    <div><div data-permission-tokens></div><select data-permission-select><option>Ajouter une portee</option></select></div>
                </div>
            </div>
        </section>
        <section data-permission-group="documents">
            <h2>Documents</h2>
            <div><div data-permission-key="CAN_EDIT_DOCUMENT">
                <div><strong>Modifier des documents</strong><code>CAN_EDIT_DOCUMENT</code><p>Description</p></div>
                <div><div data-permission-tokens></div><select data-permission-select><option>Ajouter une portee</option></select></div>
            </div></div>
        </section>
    </div>
</main>
<script src="/common/permissions/editor.js"></script>
<script>
(async function () {
    const root = document.getElementById('permissions');
    const result = document.getElementById('result');
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    try {
        for (const row of root.querySelectorAll('[data-permission-key]')) {
            row.classList.add('omo-holon-create__permission-row');
            row.lastElementChild.classList.add('omo-holon-create__permission-picker');
        }
        window.omoPermissionEditorEnhance(root, {member: {CAN_EDIT_DOCUMENT: {visibleItems: [{label: 'Organisation'}]}}});
        const search = root.querySelector('input[type="search"]');
        const assigned = root.querySelector('input[type="checkbox"]');
        const rows = Array.from(root.querySelectorAll('[data-permission-key]'));
        const count = () => root.querySelectorAll('[data-permission-token]').length;
        assert(rows.length === 3 && count() === 1, 'Enhancement must preserve rows and assignments');
        assert(root.querySelectorAll('details[data-permission-group]').length === 2, 'Application accordions missing');
        assert(root.querySelector('.omo-permission-editor__profile-legend').textContent.includes('M : Membres'), 'Profile legend missing');
        assert(root.querySelector('.omo-permission-editor__profile-legend-columns').textContent === 'MAC', 'Profile columns must use compact abbreviations');
        assert(rows.every(row => row.classList.contains('omo-permission-editor__row')), 'Permission rows must use the full-width layout');
        assert(!rows[0].textContent.includes('Local'), 'The redundant local label must not be rendered');
        assert(getComputedStyle(rows[0].querySelector('[data-permission-tokens]')).display === 'grid', 'Ranges must be displayed one per line');
        assert(rows[0].querySelector('[data-permission-select]').parentElement.contains(rows[0].querySelector('details.generic-meta--compact')), 'Permission details must be below the range picker');
        assert(root.querySelector('[data-permission-key="CAN_EDIT_DOCUMENT"]').textContent.includes('Organisation'), 'Inherited scope missing');
        search.value = 'CAN_DELETE_PROJECT'; search.dispatchEvent(new Event('input'));
        assert(rows.filter(row => !row.hidden).length === 1, 'Search must match permission codes');
        assert(count() === 1, 'Filtering must preserve configured scopes for saving');
        search.value = ''; search.dispatchEvent(new Event('input'));
        assigned.checked = true; assigned.dispatchEvent(new Event('change'));
        assert(rows.filter(row => !row.hidden).length === 2, 'Assigned filter must include inherited scopes');
        const token = document.createElement('span'); token.dataset.permissionToken = 'context'; token.dataset.permissionScope = ''; token.innerHTML = '<input type="checkbox" data-permission-profile="collective" checked>';
        rows[1].querySelector('[data-permission-tokens]').append(token);
        await new Promise(resolve => setTimeout(resolve, 0));
        assert(!rows[1].hidden, 'Filter must react to new assignments');
        token.remove();
        await new Promise(resolve => setTimeout(resolve, 0));
        assert(rows[1].hidden, 'Filter must react to removed assignments');
        assigned.checked = false; assigned.dispatchEvent(new Event('change'));
        assert(rows.every(row => !row.hidden), 'Clearing filters must restore every permission');
        result.textContent = 'PASS: grouping, search, inheritance, scope preservation and dynamic assignments';
    } catch (error) {
        result.textContent = 'FAIL: ' + error.message;
        throw error;
    }
})();
</script>
</html>
