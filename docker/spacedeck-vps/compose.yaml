services:
  spacedeck:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: opengov-spacedeck:node24
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    expose:
      - "9666"
    volumes:
      - spacedeck_storage:/app/storage
      - spacedeck_database:/app/database
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9666/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

networks:
  proxy:
    external: true
    name: collabora_collabora

volumes:
  spacedeck_storage:
  spacedeck_database:
