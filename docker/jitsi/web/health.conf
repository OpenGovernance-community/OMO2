
# Only these two read-only health resources are public; no REST API prefix is exposed.
# Resolve at request time so a recreated component does not require a frontend restart.
location = /omo-health/jicofo {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $omo_jicofo jicofo;
    proxy_pass http://$omo_jicofo:8888/about/health;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 500 502 503 504 =503 @omo_health_unavailable;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET { deny all; }
}

location = /omo-health/videobridge {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $omo_videobridge jvb;
    proxy_pass http://$omo_videobridge:8080/about/health;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 500 502 503 504 =503 @omo_health_unavailable;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET { deny all; }
}

location @omo_health_unavailable {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 503;
}

location ^~ /omo-health/ { return 404; }
