services:
  collabora:
    image: collabora/code:25.04.10.3.1
    restart: unless-stopped
    privileged: true
    environment:
      aliasgroup1: ${WOPI_ALIAS_GROUP}
      DONT_GEN_SSL_CERT: "true"
      username: ${COLLABORA_ADMIN_USER}
      password: ${COLLABORA_ADMIN_PASSWORD}
    command:
      - --o:ssl.enable=false
      - --o:ssl.termination=true
      - --o:welcome.enable=false
      - --o:home_mode.enable=true
      - --o:net.content_security_policy=frame-ancestors https://opengov.tools https://*.opengov.tools
    expose:
      - "9980"
    networks:
      - collabora

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - collabora
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - collabora

networks:
  collabora:

volumes:
  caddy_data:
  caddy_config:
