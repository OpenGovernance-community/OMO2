<VirtualHost *:80>
    ServerName doc.localtest.me
    Redirect permanent / https://doc.localtest.me/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName doc.localtest.me
    UseCanonicalName Off

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/dev-localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/dev-localhost.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "doc.localtest.me"
    ProxyPass /socket.io/ ws://etherpad:9001/socket.io/
    ProxyPassReverse /socket.io/ ws://etherpad:9001/socket.io/
    ProxyPass / http://etherpad:9001/
    ProxyPassReverse / http://etherpad:9001/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
</IfModule>

<VirtualHost *:80>
    ServerName document.localtest.me
    Redirect permanent / https://document.localtest.me/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName document.localtest.me
    UseCanonicalName Off
    AllowEncodedSlashes NoDecode

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/dev-localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/dev-localhost.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "document.localtest.me"

    ProxyPass /browser http://collabora:9980/browser retry=0
    ProxyPassReverse /browser http://collabora:9980/browser
    ProxyPass /hosting/discovery http://collabora:9980/hosting/discovery retry=0
    ProxyPassReverse /hosting/discovery http://collabora:9980/hosting/discovery
    ProxyPass /hosting/capabilities http://collabora:9980/hosting/capabilities retry=0
    ProxyPassReverse /hosting/capabilities http://collabora:9980/hosting/capabilities
    ProxyPass /cool/ws ws://collabora:9980/cool/ws nocanon
    ProxyPassReverse /cool/ws ws://collabora:9980/cool/ws
    ProxyPassMatch ^/cool/(.*)/ws$ ws://collabora:9980/cool/$1/ws nocanon
    ProxyPass /cool/adminws ws://collabora:9980/cool/adminws retry=0
    ProxyPass /cool http://collabora:9980/cool retry=0
    ProxyPassReverse /cool http://collabora:9980/cool
    ProxyPass / http://collabora:9980/ retry=0
    ProxyPassReverse / http://collabora:9980/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
</IfModule>

<VirtualHost *:80>
    ServerName calc.localtest.me
    Redirect permanent / https://calc.localtest.me/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName calc.localtest.me
    UseCanonicalName Off

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/dev-localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/dev-localhost.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "calc.localtest.me"

    # OMO uses the private Docker network for state-changing EtherCalc API calls.
    # The public endpoint only exposes the browser UI and read-only API requests.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD|OPTIONS)$
    RewriteRule ^/_($|/) - [F,L]

    # SocialCalc's stylesheet resolves toolbar image URLs below /static/images/.
    # EtherCalc serves the same image assets below /images/.
    ProxyPass /static/images/ http://ethercalc:8000/images/
    ProxyPassReverse /static/images/ http://ethercalc:8000/images/
    # Some SocialCalc controls resolve images relative to the current room URL.
    ProxyPassMatch ^/[^/]+/images/(.*)$ http://ethercalc:8000/images/$1
    ProxyPassReverse /images/ http://ethercalc:8000/images/
    ProxyPass /_ws/ ws://ethercalc:8000/_ws/
    ProxyPassReverse /_ws/ ws://ethercalc:8000/_ws/
    ProxyPass / http://ethercalc:8000/
    ProxyPassReverse / http://ethercalc:8000/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
</IfModule>

<VirtualHost *:80>
    ServerName localhost
    ServerAlias app *.localhost localtest.me *.localtest.me omo.test *.omo.test
    UseCanonicalName Off

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    ServerAlias app *.localhost localtest.me *.localtest.me omo.test *.omo.test
    UseCanonicalName Off

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/dev-localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/dev-localhost.key

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
</IfModule>
