<VirtualHost *:80>
    ServerName doc.localtest.me
    Redirect permanent / https://doc.localtest.me/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName doc.localtest.me
    UseCanonicalName Off

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/dev-localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/dev-localhost.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "doc.localtest.me"
    ProxyPass /socket.io/ ws://etherpad:9001/socket.io/
    ProxyPassReverse /socket.io/ ws://etherpad:9001/socket.io/
    ProxyPass / http://etherpad:9001/
    ProxyPassReverse / http://etherpad:9001/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
</IfModule>

<VirtualHost *:80>
    ServerName localhost
    ServerAlias *.localhost localtest.me *.localtest.me omo.test *.omo.test
    UseCanonicalName Off

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    ServerAlias *.localhost localtest.me *.localtest.me omo.test *.omo.test
    UseCanonicalName Off

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/dev-localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/dev-localhost.key

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
</IfModule>
